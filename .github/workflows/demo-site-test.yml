name: Demo Site Test CI/CD

on:
  push:
    branches:
      - test
    paths:
      - "apps/demo-site/**"
      - ".github/workflows/demo-site-test.yml"

  workflow_dispatch:

permissions:
  contents: read

jobs:
  deploy:
    name: Deploy Demo Site
    runs-on: ubuntu-latest

    environment: test

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Deploy to Azure Static Web Apps
        uses: Azure/static-web-apps-deploy@v1
        with:
          azure_static_web_apps_api_token: ${{ secrets.AZURE_STATIC_WEB_APPS_API_TOKEN_DEMO_TEST }}
          action: "upload"

          app_location: "apps/demo-site"
          output_location: ""

          skip_app_build: true
