name: Widget Test CI/CD

on:
  push:
    branches:
      - test

    paths:
      - "apps/chat-widget/**"
      - ".github/workflows/widget-test.yml"

  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: widget-test
  cancel-in-progress: true

jobs:
  build:
    name: Build Widget
    runs-on: ubuntu-latest

    environment: test

    defaults:
      run:
        working-directory: apps/chat-widget

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: apps/chat-widget/package-lock.json

      - name: Validate configuration
        env:
          VITE_API_BASE_URL: ${{ vars.VITE_API_BASE_URL }}
        run: |
          if [ -z "$VITE_API_BASE_URL" ]; then
            echo "VITE_API_BASE_URL is not configured."
            exit 1
          fi

          echo "Required build configuration is available."

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Build test widget
        env:
          VITE_API_BASE_URL: ${{ vars.VITE_API_BASE_URL }}
        run: npm run build:test

      - name: Validate build output
        run: |
          test -f dist/index.html
          test -f dist/widget.js

          echo "Widget build output validated."

      - name: Upload widget artifact
        uses: actions/upload-artifact@v4
        with:
          name: widget-test-dist
          path: apps/chat-widget/dist
          if-no-files-found: error
          retention-days: 3


  deploy:
    name: Deploy Widget
    runs-on: ubuntu-latest

    needs:
      - build

    environment: test

    steps:
      - name: Download widget artifact
        uses: actions/download-artifact@v5
        with:
          name: widget-test-dist
          path: apps/chat-widget/dist

      - name: Deploy to Azure Static Web Apps
        uses: Azure/static-web-apps-deploy@v1
        with:
          azure_static_web_apps_api_token: ${{ secrets.AZURE_WIDGET_STATIC_WEB_APPS_API_TOKEN }}
          action: upload
          app_location: apps/chat-widget/dist
          api_location: ""
          output_location: ""
          skip_app_build: true


  smoke-test:
    name: Smoke Test Widget
    runs-on: ubuntu-latest

    needs:
      - deploy

    environment: test

    steps:
      - name: Validate smoke test configuration
        env:
          WIDGET_BASE_URL: ${{ vars.WIDGET_BASE_URL }}
        run: |
          if [ -z "$WIDGET_BASE_URL" ]; then
            echo "WIDGET_BASE_URL is not configured."
            exit 1
          fi

      - name: Check widget application
        env:
          WIDGET_BASE_URL: ${{ vars.WIDGET_BASE_URL }}
        run: |
          curl \
            --fail \
            --silent \
            --show-error \
            --retry 5 \
            --retry-delay 5 \
            "$WIDGET_BASE_URL/"

      - name: Check widget loader
        env:
          WIDGET_BASE_URL: ${{ vars.WIDGET_BASE_URL }}
        run: |
          curl \
            --fail \
            --silent \
            --show-error \
            --retry 5 \
            --retry-delay 5 \
            "$WIDGET_BASE_URL/widget.js"

      - name: Widget deployment completed
        env:
          WIDGET_BASE_URL: ${{ vars.WIDGET_BASE_URL }}
        run: |
          echo "Widget deployed successfully."
          echo "Widget URL: $WIDGET_BASE_URL"
          echo "Loader URL: $WIDGET_BASE_URL/widget.js"